# env.yaml — copy to env.yaml, fill in real values, and add env.yaml to .gitignore
#
# Structured to support multi-env switching via `ENV=staging pytest …`.

default:
  api_url: "https://api.example.com"
  timeout: 15

uat:
  api_url: "https://api.uat.example.com"
  # WAF bypass header (if your infra has one)
  # extra_headers:
  #   x-bypass-waf: "SECRET_VALUE"
  auth:
    username: ""
    password: ""
    # For OTP-based flows:
    # fixed_otp: "000000"

prod:
  api_url: "https://api.example.com"
  # Prod usually runs read-only smoke only; write tests gated by marker.
