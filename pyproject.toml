[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-api-kit"
version = "0.1.0"
description = "Pragmatic scaffolding for API smoke / regression tests — zero-dep schema, snapshot drift, HTML reports, AWS ECS deploy."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jack Kao", email = "kao273183@users.noreply.github.com" },
]
keywords = ["pytest", "api", "testing", "smoke-test", "snapshot", "schema"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "requests>=2.31",
  "pytest>=8.0",
  "pytest-html>=4.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "pytest-html>=4.1",
]

[project.urls]
Homepage = "https://github.com/kao273183/pytest-api-kit"
Issues = "https://github.com/kao273183/pytest-api-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["examples"]
python_files = ["test_*.py"]
addopts = "-v --html=report.html --self-contained-html"
